<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시맨틱 태그 예제</title>
</head>
<body>
<!--
    HTML5 시맨틱 태그들은 문서의 의미와 구역(Section)을 나누는 핵심 요소입니다. 각 태그는 자유롭게 중첩할 수 있는 것처럼 보이지만,문맥적 의미와 접근성을 해치지 않기 위해 지켜야 하는 명확한 제약 조건과 권장 사항이 있습니다.
<main>
(메인 본문 영역)
•
페이지당 오직 1개만 노출: 문서 전체에서실제 화면에 보이는<main>태그는 오직 하나여야 합니다. (단,hidden속성이 들어간<main>이 따로 존재하는 경우는 예외)
•
포함 금지 영역:<main>태그는 다른 구역 태그의 자식으로 들어갈 수 없습니다.
•
금지 중첩:<header>,<nav>,<article>,<aside>,<footer>내부에<main>을 넣는 것은문법 오류입니다.
•
올바른 위치:<body>의 직계 자식 또는 단순 레이아웃용<div>바로 아래에 위치해야 합니다.


2.
<header>
및
<footer>
(머리말 / 꼬리말)
•
독립적 구역(Sectioning Content)마다 중첩 가능:
•
<body>바로 아래에 쓰이면페이지 전체의 헤더/푸터역할을 합니다.
•
<article>이나<section>내부에도각각의 독립된<header>와<footer>를 중첩하여 사용할 수 있습니다.
•
중첩 금지 제약:
•
<header>내부에 또 다른<header>나<footer>를 넣을 수 없습니다.
•
<footer>내부에 또 다른<footer>나<header>를 넣을 수 없습니다.
•
<address>태그 내부에<header>나<footer>를 넣을 수 없습니다.


3.
<section>
vs
<article>
(구역 vs 독립된 글)
둘 다 상호 간에 제한 없이자유롭게 상호 중첩이 가능하지만,의미에 따른 중첩 기준이 있습니다.

•
<article>내부에<section>중첩 (가장 흔함):
•
하나의 독립된 블로그 포스트나 뉴스 기사(<article>) 내부를 여러 주제 단락(<section>)으로 나눌 때 사용합니다.
•
<section>내부에<article>중첩:
•
특정 주제 구역(<section>) 내에 독립된 여러 개의 콘텐츠 단위(<article>)가 나열될 때 사용합니다.
•
예시: "최신 뉴스 목록" 구역(<section>) 안에 각각의 뉴스 기사 카드들(<article>)이 들어가는 구조.


4.
<aside>
(사이드바 / 본문 외 콘텐츠)
•
중첩 및 위치 유의점:
•
<body>직계로 쓰이면 페이지 전체의 사이드바(연관 링크, 프로필 등) 역할을 합니다.
•
<article>이나<section>내부에 들어가면해당 글과 관련된 부가 정보(주석, 연관글 추천, 용어 사전 등) 역할을 합니다.
•
금지 제약:<aside>내부에 또 다른<aside>를 넣는 것은 문맥상 권장되지 않습니다.
💡 한눈에 보는 핵심 중첩 제약 표
태그	상위(부모)로 가질 수 없는 태그	하위(자식)로 포함할 수 없는 태그
<main>	<header>, <footer>, <nav>, <article>, <aside>	자기 자신 (<main>)
<header>	<header>, <footer>, <address>	<header>, <footer>
<footer>	<header>, <footer>, <address>	<header>, <footer>
<article>	제한 없음	제한 없음
<section>	제한 없음	제한 없음

-->
  <!-- 페이지 전체 헤더 -->
  <header>
    <h1>로고 및 사이트 제목</h1>
    <nav>메뉴</nav>
  </header>

  <!-- 메인 영역 (페이지에 1개) -->
  <main>
    <!-- 뉴스 섹션 구역 -->
    <section>
      <h2>최신 뉴스</h2>

      <!-- 섹션 내부의 독립된 기사 카드 -->
      <article>
        <!-- 기사 개별 헤더 -->
        <header>
          <h3>기사 제목</h3>
        </header>
        <p>기사 본문 내용...</p>
        <!-- 기사 개별 푸터 -->
        <footer>작성일: 2026-07-30</footer>
      </article>
    </section>
  </main>

  <!-- 페이지 전체 푸터 -->
  <footer>
    <p>Copyright © Company All rights reserved.</p>
  </footer>



    
</body>
</html>
